name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 시스템 의존성 (한국어 폰트·LibreOffice·poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum poppler-utils
      - name: pip 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-mock ruff
      - name: 린트 (ruff)
        run: ruff check app/
        continue-on-error: true   # 첫 도입은 경고만
      - name: 매크로 카운트 + 파이프라인 테스트
        env:
          LLM_PROVIDER: mock
          PYTHONIOENCODING: utf-8
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: npm install
        run: npm install --legacy-peer-deps
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
        continue-on-error: true
      - name: Next.js build
        env:
          NEXT_PUBLIC_API_BASE: http://localhost:8000
        run: npm run build

  smoke:
    name: 통합 스모크 (백+프 + API 검증)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: deps
        run: |
          pip install --upgrade pip
          pip install -e apps/backend
          pip install httpx pytest pytest-asyncio
      - name: 백엔드 기동 (mock provider)
        env:
          LLM_PROVIDER: mock
          PYTHONIOENCODING: utf-8
        run: |
          cd apps/backend
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in {1..30}; do
            curl -sf http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
      - name: API 스모크 — 변환·매크로·렌더·매크로 카운트
        run: |
          curl -sf http://127.0.0.1:8000/api/v1/health
          curl -sf http://127.0.0.1:8000/api/v1/macros/stats | python -c "import sys,json; d=json.load(sys.stdin); assert d['total']==101, f'매크로 카운트 {d[\"total\"]} ≠ 101'; print('macros OK')"
          curl -sf -X POST http://127.0.0.1:8000/api/v1/convert \
            -H 'Content-Type: application/json' \
            -d '{"source":"# Test\nbody 1,000원","persona_mode":"worker"}' \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['preview']['review_counts']['yellow']>=1; print('convert OK')"
