[project]
name = "docuax-backend"
version = "0.1.0"
description = "DocuAX backend — 마크다운을 한 번에 한국 회사 문서로"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TenAI", email = "team@tenai.kr" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=44.0.0",   # Fernet — 사용자 API 키 암호화 저장 (BYOK)
    "bcrypt>=4.2.0",          # 직접 사용 (passlib 5.x 비호환 회피)
    "aiosmtplib>=3.0.0",       # Gmail SMTP (STARTTLS)
    "jinja2>=3.1.0",            # Email HTML templates
    "orjson>=3.10.0",
    "structlog>=24.4.0",

    # Document rendering
    "python-docx>=1.1.2",
    "python-hwpx>=2.9.1",     # HWPX read/write — 2.x 시리즈 필수 (ensure_char_property 등)
    "lxml>=5.3.0",            # HWPX XML 조작
    "markdown-it-py>=3.0.0",  # Markdown → AST
    "mdit-py-plugins>=0.4.0",
    "pillow>=10.4.0",
    "weasyprint>=63.0",       # PDF (alt: LibreOffice headless)
    "pypdf>=5.1.0",           # PDF 텍스트 추출
    "beautifulsoup4>=4.12.0", # HTML 추출
    "markdownify>=0.13.0",    # HTML → Markdown
    "olefile>=0.47",          # HWP 레거시 바이너리 폴백
    "python-pptx>=1.0.2",     # PPTX 테마 추출

    # 시각 요소 — 차트·수식 렌더링
    "matplotlib>=3.9.0",      # 차트(bar/line/pie/donut) + 수식(MathText) PNG 렌더
    "reportlab>=4.2.0",       # PDF fallback (matplotlib 의존성과 같이 사용 가능)

    # LLM providers (optional — installed always but used conditionally)
    "openai>=1.54.0",         # used by OpenAI provider + vLLM (OpenAI-compatible)
    "anthropic>=0.39.0",

    # RAG
    "chromadb>=0.5.15",
    "sentence-transformers>=3.2.0",
    "tiktoken>=0.8.0",

    # 결제 (선택 — STRIPE_SECRET_KEY 미설정 시 비활성)
    "stripe>=11.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
